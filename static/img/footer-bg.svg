<!-- footer-bg.svg -->
<svg width="100%" height="100%" viewBox="0 0 1440 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 夜空渐变背景 -->
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- 背景矩形 -->
  <rect width="100%" height="100%" fill="url(#skyGradient)" />

  <!-- 动态星星粒子 -->
  <circle cx="10%" cy="20%" r="1.5" fill="white">
    <animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="50%" cy="10%" r="1" fill="white">
    <animate attributeName="opacity" values="1;0.1;1" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="70%" cy="30%" r="1.3" fill="white">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="90%" cy="15%" r="1.6" fill="white">
    <animate attributeName="opacity" values="1;0.3;1" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="30%" cy="35%" r="1.2" fill="white">
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- 底部波浪遮盖过渡 -->
  <path
    fill="#0f172a"
    d="M0,160L80,149.3C160,139,320,117,480,106.7C640,96,800,96,960,106.7C1120,117,1280,139,1360,149.3L1440,160L1440,320L0,320Z"
  />
</svg>
