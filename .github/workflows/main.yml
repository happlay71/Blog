name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"

      - name: Install dependencies
        run: npm install

      - name: Clear project
        run: npm run clear

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/
          retention-days: 1

  deploy-jdcloud:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: build/

      - name: Verify build files
        run: |
          echo "Checking build directory..."
          ls -la build/
          echo "Files found in build directory"

      - name: Deploy to JDCloud
        uses: easingthemes/ssh-deploy@v4.1.10
        with:
          SSH_PRIVATE_KEY: ${{ secrets.JD_SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.JD_USER_HOST }}
          REMOTE_USER: ${{ secrets.JD_USER_NAME }}
          SOURCE: "build/"
          ARGS: "-rltgoDzvO --delete"
          TARGET: /data/docker/nginx/html/build
